<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexaServ — Mensagens</title>
<style>
:root{--navy:#102b4e;--teal:#0b938d;--bg:#f3f6fa;--line:#e4eaf1;--muted:#718096;--white:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:#17283e}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{max-width:1100px;margin:auto;padding:15px 18px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:23px;font-weight:800;color:var(--navy)}.brand span{color:var(--teal)}
.top button,.back{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 13px;font-weight:700;color:var(--navy);cursor:pointer}
main{max-width:1100px;margin:24px auto;padding:0 16px}
.heading{margin:0 0 16px}.heading h1{margin:0 0 5px;font-size:26px}.heading p{margin:0;color:var(--muted);font-size:14px}
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);height:min(690px,calc(100vh - 160px));min-height:480px;background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 8px 28px #152b4509}
.sidebar{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-title{padding:18px 17px;border-bottom:1px solid var(--line);font-weight:800;font-size:17px}
.list{overflow:auto;flex:1}
.conversation{width:100%;border:0;border-bottom:1px solid #edf0f4;background:#fff;text-align:left;padding:15px 16px;display:flex;gap:11px;align-items:center;cursor:pointer}
.conversation:hover,.conversation.active{background:#f0f8f8}
.avatar{width:43px;height:43px;flex:0 0 43px;border-radius:50%;background:#e5f1f1;color:var(--teal);display:grid;place-items:center;font-weight:800;font-size:18px}
.details{min-width:0;flex:1}.person{font-weight:800;font-size:14px;margin-bottom:5px}.preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat{display:flex;flex-direction:column;min-width:0;min-height:0}
.chat-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;min-height:72px}
.chat-head strong{font-size:15px}.chat-head small{display:block;color:var(--muted);margin-top:4px}
.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:11px;background:#f8fafc}
.bubble{max-width:min(78%,520px);padding:11px 13px;border-radius:14px;background:#fff;border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere;line-height:1.45;font-size:14px}
.bubble.mine{align-self:flex-end;background:#e4f5f2;border-color:#c9e9e3}
.time{font-size:10px;color:var(--muted);display:block;text-align:right;margin-top:5px}
.composer{display:flex;gap:9px;padding:13px;border-top:1px solid var(--line);background:#fff}
.composer textarea{resize:none;flex:1;min-height:44px;max-height:110px;border:1px solid #d8e1e9;border-radius:10px;padding:12px;font:14px Arial;outline:none}
.composer textarea:focus{border-color:var(--teal)}
.send{border:0;background:var(--teal);color:white;font-weight:800;border-radius:10px;padding:0 19px;cursor:pointer}
.send:disabled{opacity:.5;cursor:not-allowed}
.empty{margin:auto;text-align:center;color:var(--muted);padding:25px;line-height:1.6}
.empty b{display:block;color:var(--navy);font-size:17px;margin-bottom:7px}
.status{padding:10px 15px;color:#53677d;font-size:13px;background:#fff;border-bottom:1px solid var(--line)}
.hidden{display:none!important}
@media(max-width:700px){
 main{margin:12px auto;padding:0 9px}.heading{padding:0 5px}.heading h1{font-size:23px}
 .layout{display:block;height:calc(100vh - 145px);min-height:460px;position:relative;border-radius:13px}
 .sidebar{height:100%;border:0}.chat{display:none;height:100%;position:absolute;inset:0;background:#fff}
 .layout.chat-open .sidebar{display:none}.layout.chat-open .chat{display:flex}
 .chat-head{padding:11px}.mobile-back{display:block!important;margin-right:2px}
 .messages{padding:14px}.bubble{max-width:88%}
}
.mobile-back{display:none;border:0;background:transparent;color:var(--navy);font-size:22px;padding:4px;cursor:pointer}
</style>
</head>
<body>
<header><div class="top"><div class="brand">Nexa<span>Serv</span></div><button type="button" onclick="location.href='index.html'">Página inicial</button></div></header>
<main>
<div class="heading"><h1>Mensagens</h1><p>Converse diretamente com clientes e profissionais.</p></div>
<div id="status" class="status">A verificar a sua sessão...</div>
<section class="layout" id="layout">
<aside class="sidebar">
<div class="side-title">Conversas</div>
<div class="list" id="conversationList"><div class="empty">A carregar conversas...</div></div>
</aside>
<section class="chat" id="chatPanel">
<div class="chat-head">
<button class="mobile-back" type="button" onclick="backToList()" aria-label="Voltar">‹</button>
<div class="avatar" id="chatAvatar">N</div>
<div><strong id="chatName">NexaServ</strong><small id="chatSub">As suas mensagens privadas</small></div>
</div>
<div class="messages" id="messages"><div class="empty"><b>Bem-vindo ao chat NexaServ</b>Selecione uma conversa para ver as mensagens.</div></div>
<form class="composer" id="messageForm">
<textarea id="messageInput" placeholder="Escreva uma mensagem..." maxlength="3000" disabled></textarea>
<button class="send" id="sendButton" type="submit" disabled>Enviar</button>
</form>
</section>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://zfwrojqzoitebaytvvxa.supabase.co';
const SUPABASE_KEY='sb_publishable_7-CKacj6-07FxsnDRJSUPQ_-hvijNYm';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null, activeConversation=null, realtimeChannel=null, conversations=[];
const $=id=>document.getElementById(id);
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setStatus(text){$('status').textContent=text;}
function backToList(){$('layout').classList.remove('chat-open');}
function openChatLayout(){$('layout').classList.add('chat-open');}
function initials(name){return (String(name||'N').trim().charAt(0)||'N').toUpperCase();}
function timeLabel(value){if(!value)return '';const d=new Date(value);return d.toLocaleString('pt-AO',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'});}
async function init(){
 const {data:{session},error}=await db.auth.getSession();
 if(error||!session){setStatus('Inicie sessão para aceder às suas mensagens.');$('conversationList').innerHTML='<div class="empty"><b>É necessário iniciar sessão</b>Entre na sua conta de cliente ou profissional para utilizar o chat.<br><br><button class="back" onclick="location.href=\'contratador.html\'">Entrar como cliente</button><br><br><button class="back" onclick="location.href=\'conta.html\'">Entrar como profissional</button></div>';return;}
 currentUser=session.user;
 setStatus('Sessão ativa. As suas conversas privadas aparecem abaixo.');
 await loadConversations();
 const params=new URLSearchParams(location.search);
 const providerId=params.get('provider');
 if(providerId) await openOrCreateConversation(providerId);
}
async function loadConversations(){
 const {data,error}=await db.from('conversations').select('id,customer_id,provider_id,created_at,last_message_at').or('customer_id.eq.'+currentUser.id+',provider_id.eq.'+currentUser.id);
 if(error){$('conversationList').innerHTML='<div class="empty">Não foi possível carregar as conversas. '+esc(error.message)+'</div>';return;}
 conversations=data||[];
 if(!conversations.length){$('conversationList').innerHTML='<div class="empty"><b>Ainda não tem conversas</b>Quando iniciar uma conversa com um profissional ou cliente, ela aparecerá aqui.</div>';return;}
 const otherIds=[...new Set(conversations.map(c=>c.customer_id===currentUser.id?c.provider_id:c.customer_id))];
 const {data:providerRows}=await db.from('providers').select('provider_id,title,category').in('provider_id',otherIds);
 const {data:profileRows}=await db.from('profiles').select('id,name').in('id',otherIds);
 const providerMap=new Map((providerRows||[]).map(p=>[p.provider_id,p]));
 const profileMap=new Map((profileRows||[]).map(p=>[p.id,p]));
 const enriched=await Promise.all(conversations.map(async c=>{
   const other=c.customer_id===currentUser.id?c.provider_id:c.customer_id;
   const isOtherProvider=providerMap.has(other);
   const name=isOtherProvider?(providerMap.get(other).title||'Profissional'):(profileMap.get(other)?.name||'Cliente');
   const {data:latest}=await db.from('messages').select('content,created_at').eq('conversation_id',c.id).order('created_at',{ascending:false}).limit(1).maybeSingle();
   return {...c,other,name,latest,isOtherProvider};
 }));
 enriched.sort((a,b)=>new Date(b.latest?.created_at||b.created_at)-new Date(a.latest?.created_at||a.created_at));
 conversations=enriched;
 $('conversationList').innerHTML=conversations.map(c=>`<button class="conversation ${activeConversation===c.id?'active':''}" data-conversation="${esc(c.id)}"><span class="avatar">${esc(initials(c.name))}</span><span class="details"><span class="person">${esc(c.name)}</span><span class="preview">${esc(c.latest?.content||'Conversa iniciada')}</span></span></button>`).join('');
}
$('conversationList').addEventListener('click',e=>{const b=e.target.closest('[data-conversation]');if(!b)return;selectConversation(b.dataset.conversation);});
async function selectConversation(id){
 const c=conversations.find(x=>x.id===id);
 if(!c)return;
 activeConversation=id;
 $('chatName').textContent=c.name;
 $('chatSub').textContent=c.isOtherProvider?'Profissional no NexaServ':'Cliente no NexaServ';
 $('chatAvatar').textContent=initials(c.name);
 $('messageInput').disabled=false;$('sendButton').disabled=false;
 openChatLayout();
 await loadMessages();
 if(realtimeChannel)await db.removeChannel(realtimeChannel);
 realtimeChannel=db.channel('messages-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+id},payload=>{
   if(payload.new.sender_id!==currentUser.id)loadMessages();
 }).subscribe();
 await loadConversations();
}
async function loadMessages(){
 if(!activeConversation)return;
 const {data,error}=await db.from('messages').select('id,sender_id,content,created_at').eq('conversation_id',activeConversation).order('created_at',{ascending:true});
 if(error){$('messages').innerHTML='<div class="empty">Não foi possível carregar as mensagens.</div>';return;}
 if(!data||!data.length){$('messages').innerHTML='<div class="empty">Esta conversa começou agora.<br>Envie a primeira mensagem.</div>';return;}
 $('messages').innerHTML=data.map(m=>`<div class="bubble ${m.sender_id===currentUser.id?'mine':''}">${esc(m.content)}<span class="time">${timeLabel(m.created_at)}</span></div>`).join('');
 $('messages').scrollTop=$('messages').scrollHeight;
}
$('messageForm').addEventListener('submit',async e=>{
 e.preventDefault();const content=$('messageInput').value.trim();
 if(!content||!activeConversation||!currentUser)return;
 $('sendButton').disabled=true;
 const {error}=await db.from('messages').insert({conversation_id:activeConversation,sender_id:currentUser.id,content});
 if(error){alert('Não foi possível enviar a mensagem: '+error.message);$('sendButton').disabled=false;return;}
 $('messageInput').value='';$('sendButton').disabled=false;
 await loadMessages();await loadConversations();
});
async function openOrCreateConversation(providerId){
 if(providerId===currentUser.id){setStatus('Não pode iniciar uma conversa consigo mesmo.');return;}
 const {data:provider,error:providerError}=await db.from('providers').select('provider_id,title').eq('provider_id',providerId).maybeSingle();
 if(providerError||!provider){setStatus('Não foi possível encontrar este profissional.');return;}
 const {data:existing}=await db.from('conversations').select('id').eq('customer_id',currentUser.id).eq('provider_id',providerId).maybeSingle();
 let conversationId=existing?.id;
 if(!conversationId){
   const {data,error}=await db.from('conversations').insert({customer_id:currentUser.id,provider_id:providerId}).select('id').single();
   if(error){setStatus('Não foi possível iniciar a conversa: '+error.message);return;}
   conversationId=data.id;
 }
 await loadConversations();
 await selectConversation(conversationId);
}
init();
</script>
</body>
</html>
