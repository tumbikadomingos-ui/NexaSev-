<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contratador — NexaServ</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f3f7fb;font-family:Arial,sans-serif;color:#17283e}header{background:#fff;padding:18px 7%;border-bottom:1px solid #e5edf4}.brand{font-size:24px;font-weight:800;color:#123c70}.brand span{color:#13a6a0}main{width:min(460px,calc(100% - 32px));margin:40px auto;background:#fff;border:1px solid #e4ebf2;border-radius:18px;padding:28px;box-shadow:0 12px 35px #15305012}h1{margin:0 0 8px;font-size:27px;color:#17385e}.sub{margin:0 0 24px;color:#6a7b90;line-height:1.5}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#edf3f8;padding:4px;border-radius:10px;margin-bottom:22px}.tabs button{border:0;padding:11px;border-radius:8px;background:transparent;color:#52657c;font-weight:700}.tabs button.active{background:#fff;color:#145da0}label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid #d7e1eb;border-radius:9px;font-size:15px}.primary{width:100%;border:0;border-radius:10px;padding:14px;background:#0b938d;color:white;font-size:15px;font-weight:700;margin-top:22px}.message{margin-top:15px;font-size:14px;line-height:1.5;color:#40566e}.back{display:block;text-align:center;margin-top:20px;color:#145da0;text-decoration:none;font-size:14px}</style></head><body><header><div class="brand">Nexa<span>Serv</span></div></header><main><h1>Área do contratador</h1><p class="sub">Entre na sua conta ou crie uma conta para procurar profissionais.</p><div class="tabs"><button id="loginTab" class="active" type="button">Iniciar sessão</button><button id="signupTab" type="button">Criar conta</button></div><form id="authForm"><div id="phoneWrap" hidden><label for="phone">Número de telefone</label><input id="phone" type="tel" autocomplete="tel" placeholder="Ex.: 9xxxxxxxx"></div><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required placeholder="seuemail@exemplo.com"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="Mínimo de 6 caracteres"><button id="submitBtn" class="primary" type="submit">Iniciar sessão</button></form><div id="message" class="message" role="status"></div><a class="back" href="index.html">← Voltar à página inicial</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://zfwrojqzoitebaytvvxa.supabase.co';const SUPABASE_ANON_KEY='sb_publishable_7-CKacj6-07FxsnDRJSUPQ_-hvijNYm';const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const form=document.getElementById('authForm'),loginTab=document.getElementById('loginTab'),signupTab=document.getElementById('signupTab'),phoneWrap=document.getElementById('phoneWrap'),phoneInput=document.getElementById('phone'),submitBtn=document.getElementById('submitBtn'),message=document.getElementById('message');let mode='login';function setMode(next){mode=next;const signup=mode==='signup';loginTab.classList.toggle('active',!signup);signupTab.classList.toggle('active',signup);phoneWrap.hidden=!signup;phoneInput.required=signup;submitBtn.textContent=signup?'Criar conta':'Iniciar sessão';message.textContent=''}loginTab.onclick=()=>setMode('login');signupTab.onclick=()=>setMode('signup');form.addEventListener('submit',async e=>{e.preventDefault();message.textContent='A processar...';submitBtn.disabled=true;const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;try{if(mode==='signup'){const phone=phoneInput.value.trim();const {data,error}=await client.auth.signUp({email,password,options:{data:{account_type:'contratador',phone}}});if(error)throw error;message.textContent=data.session?'Conta criada. A entrar...':'Conta criada. Verifique o seu e-mail para confirmar a conta e depois inicie sessão.';if(data.session)location.href='servicos.html'}else{const {error}=await client.auth.signInWithPassword({email,password});if(error)throw error;location.href='servicos.html'}}catch(error){message.textContent=error.message||'Não foi possível concluir. Verifique os dados e tente novamente.'}finally{submitBtn.disabled=false}})</script></body></html>
