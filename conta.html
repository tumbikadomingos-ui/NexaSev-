<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexaServ — Entrar ou criar conta</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --primary:#111827;
  --accent:#f59e0b;
  --bg:#f5f7fb;
  --card:#ffffff;
  --muted:#667085;
  --line:#e5e7eb;
  --danger:#b42318;
  --success:#067647;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:#172033;
  min-height:100vh;
}

header{
  background:#fff;
  border-bottom:1px solid var(--line);
}

.nav{
  max-width:700px;
  margin:auto;
  padding:18px 20px;
  display:flex;
  justify-content:center;
}

.logo{
  font-size:24px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:7px;
}

.logo span{
  color:var(--accent);
}

.logo-mark{
  width:34px;
  height:34px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#f59e0b,#ff8a00);
  color:#111827;
  border-radius:9px;
  font-weight:900;
  font-size:20px;
}

main{
  max-width:500px;
  margin:0 auto;
  padding:40px 20px 60px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:28px;
  box-shadow:0 10px 35px rgba(16,24,40,.07);
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#f2f4f7;
  padding:4px;
  border-radius:12px;
  margin-bottom:28px;
}

.tabs button{
  border:0;
  background:transparent;
  padding:12px;
  border-radius:9px;
  font-weight:700;
  color:var(--muted);
  cursor:pointer;
}

.tabs button.active{
  background:#fff;
  color:var(--primary);
  box-shadow:0 2px 6px rgba(16,24,40,.08);
}

.icon{
  font-size:36px;
  margin-bottom:12px;
  text-align:center;
}

.title{
  font-size:27px;
  text-align:center;
  margin-bottom:8px;
}

.subtitle{
  color:var(--muted);
  line-height:1.5;
  text-align:center;
  margin-bottom:25px;
}

label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin-bottom:7px;
}

.input-group{
  position:relative;
  margin-bottom:17px;
}

.input-group input{
  width:100%;
  padding:14px 48px 14px 14px;
  border:1px solid #d0d5dd;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

.input-group input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(245,158,11,.14);
}

.toggle-password{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:none;
  cursor:pointer;
  font-size:18px;
}

.forgot{
  display:block;
  text-align:right;
  margin:-5px 0 18px;
  color:#b45309;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}

.submit{
  width:100%;
  border:0;
  background:var(--primary);
  color:#fff;
  padding:14px;
  border-radius:10px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

.submit:hover{
  opacity:.94;
}

.submit:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  min-height:22px;
  text-align:center;
  margin-top:15px;
  font-size:14px;
  font-weight:600;
}

.hint{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-top:20px;
  line-height:1.5;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:10;
}

.modal-box{
  background:#fff;
  width:100%;
  max-width:400px;
  border-radius:18px;
  padding:25px;
  box-shadow:0 15px 50px rgba(0,0,0,.2);
}

.modal-box h2{
  margin-bottom:8px;
}

.modal-box p{
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
  margin-bottom:20px;
}

.modal-actions{
  display:flex;
  gap:10px;
}

.modal-actions button{
  flex:1;
  padding:12px;
  border-radius:9px;
  font-weight:700;
  cursor:pointer;
}

.cancel{
  border:1px solid var(--line);
  background:#fff;
}

.reset{
  border:0;
  background:var(--primary);
  color:#fff;
}

@media(max-width:480px){
  main{
    padding:25px 14px 40px;
  }

  .card{
    padding:22px 18px;
  }

  .title{
    font-size:24px;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo">
      <span class="logo-mark">N</span>
      Nexa<span>Serv</span>
    </div>
  </div>
</header>

<main>

<section class="card">

  <div class="tabs">
    <button id="loginTab" class="active" onclick="setMode('login')">
      Entrar
    </button>

    <button id="signupTab" onclick="setMode('signup')">
      Criar conta
    </button>
  </div>

  <div class="icon">🔐</div>

  <h1 class="title" id="title">
    Entrar no NexaServ
  </h1>

  <p class="subtitle" id="subtitle">
    Entre na sua conta para continuar.
  </p>

  <form onsubmit="submitAuth(event)">

    <label for="email">E-mail</label>

    <div class="input-group">
      <input
        id="email"
        type="email"
        placeholder="seuemail@exemplo.com"
        autocomplete="email"
        required
      >
    </div>

    <label for="password">Senha</label>

    <div class="input-group">
      <input
        id="password"
        type="password"
        placeholder="Digite a sua senha"
        autocomplete="current-password"
        minlength="6"
        required
      >

      <button
        type="button"
        class="toggle-password"
        onclick="togglePassword()"
        aria-label="Mostrar senha"
      >
        👁️
      </button>
    </div>

    <span
      class="forgot"
      id="forgot"
      onclick="openReset()"
    >
      Esqueci a minha senha
    </span>

    <button
      class="submit"
      id="submit"
      type="submit"
    >
      Entrar
    </button>

  </form>

  <div class="message" id="message"></div>

  <p class="hint">
    A sua conta permite continuar para o seu espaço profissional no NexaServ.
  </p>

</section>

</main>

<div class="modal" id="resetModal">

  <div class="modal-box">

    <h2>Recuperar senha</h2>

    <p>
      Digite o seu e-mail. Enviaremos as instruções para criar uma nova senha.
    </p>

    <label for="resetEmail">E-mail</label>

    <div class="input-group">
      <input
        id="resetEmail"
        type="email"
        placeholder="seuemail@exemplo.com"
      >
    </div>

    <div class="modal-actions">

      <button
        class="cancel"
        type="button"
        onclick="closeReset()"
      >
        Cancelar
      </button>

      <button
        class="reset"
        type="button"
        onclick="resetPassword()"
      >
        Enviar
      </button>

    </div>

    <div class="message" id="resetMessage"></div>

  </div>

</div>

<script>

const SUPABASE_URL =
'https://zfwrojqzoitebaytvvxa.supabase.co';

const SUPABASE_KEY =
'sb_publishable_7-CKacj6-07FxsnDRJSUPQ_-hvijNYm';

const supabaseClient =
supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let mode = 'login';


function setMode(newMode){

  mode = newMode;

  const signup = mode === 'signup';

  document
    .getElementById('loginTab')
    .classList.toggle('active', !signup);

  document
    .getElementById('signupTab')
    .classList.toggle('active', signup);

  document.getElementById('title').textContent =
    signup
      ? 'Criar conta no NexaServ'
      : 'Entrar no NexaServ';

  document.getElementById('subtitle').textContent =
    signup
      ? 'Crie a sua conta para começar.'
      : 'Entre na sua conta para continuar.';

  document.getElementById('submit').textContent =
    signup
      ? 'Criar conta'
      : 'Entrar';

  document.getElementById('forgot').style.display =
    signup ? 'none' : 'block';

  document.getElementById('password').value = '';

  document.getElementById('message').textContent = '';
}


function togglePassword(){

  const password =
    document.getElementById('password');

  const button =
    document.querySelector('.toggle-password');

  if(password.type === 'password'){

    password.type = 'text';

    button.textContent = '🙈';

  }else{

    password.type = 'password';

    button.textContent = '👁️';
  }
}


async function submitAuth(e){

  e.preventDefault();

  const email =
    document.getElementById('email').value.trim();

  const password =
    document.getElementById('password').value;

  const msg =
    document.getElementById('message');

  const btn =
    document.getElementById('submit');

  msg.textContent = '';
  msg.style.color = '#067647';

  btn.disabled = true;
  btn.textContent = 'Aguarde...';

  try{

    let result;

    if(mode === 'signup'){

      result =
        await supabaseClient.auth.signUp({
          email: email,
          password: password
        });

      if(result.error){
        throw result.error;
      }

      if(result.data.session){

        msg.textContent =
          'Conta criada com sucesso!';

        setTimeout(
          goToOwnerPage,
          700
        );

      }else{

        msg.textContent =
          'Conta criada. Verifique o seu e-mail para confirmar a conta.';
      }

    }else{

      result =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if(result.error){
        throw result.error;
      }

      msg.textContent =
        'Sessão iniciada com sucesso!';

      setTimeout(
        goToOwnerPage,
        700
      );
    }

  }catch(err){

    msg.style.color = '#b42318';

    msg.textContent =
      mode === 'login'
        ? 'E-mail ou senha incorretos.'
        : (
          err.message ||
          'Não foi possível criar a conta.'
        );

  }finally{

    btn.disabled = false;

    btn.textContent =
      mode === 'signup'
        ? 'Criar conta'
        : 'Entrar';
  }
}


function goToOwnerPage(){

  window.location.href = 'dono.html';
}


function openReset(){

  document.getElementById('resetModal').style.display =
    'flex';

  document.getElementById('resetEmail').value =
    document.getElementById('email').value.trim();

  document.getElementById('resetMessage').textContent =
    '';
}


function closeReset(){

  document.getElementById('resetModal').style.display =
    'none';
}


async function resetPassword(){

  const email =
    document.getElementById('resetEmail').value.trim();

  const msg =
    document.getElementById('resetMessage');

  if(!email){

    msg.style.color = '#b42318';

    msg.textContent =
      'Digite o seu e-mail.';

    return;
  }

  msg.style.color = '#067647';

  msg.textContent =
    'A enviar...';

  try{

    const { error } =
      await supabaseClient.auth.resetPasswordForEmail(
        email,
        {
          redirectTo:
            window.location.origin +
            '/conta.html'
        }
      );

    if(error){
      throw error;
    }

    msg.textContent =
      'Instruções enviadas para o seu e-mail.';

  }catch(err){

    msg.style.color = '#b42318';

    msg.textContent =
      err.message ||
      'Não foi possível enviar o e-mail.';
  }
}


window.addEventListener('click', function(e){

  const modal =
    document.getElementById('resetModal');

  if(e.target === modal){

    closeReset();
  }

});

</script>

</body>
  </html>
